<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCQ Lens</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
<header><img class="mark" src="icons/icon32.png" alt="" width="20" height="20"><strong>MCQ Lens</strong><span id="mode" class="state">Off</span></header>
